name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, typecheck & unused code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prettier (format check)
        run: npm run format:check

      - name: ESLint
        run: npm run lint

      - name: Typecheck (server)
        run: npm run typecheck

      - name: Typecheck (web)
        run: npm run typecheck:web

      - name: Unused code / dependencies (knip)
        run: npm run knip

  test:
    name: Tests & coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit & integration tests with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: warn

  build:
    name: Build (server + cockpit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build server (tsc)
        run: npm run build

      - name: Build cockpit SPA (vite)
        run: npm run web:build

  pr-assistant-version:
    name: PR assistant version bumped
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: A change to what pr-assistant ships bumps its version
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          changed=$(git diff --name-only "$BASE"...HEAD -- pr-assistant/ ':!pr-assistant/tests/')
          [ -z "$changed" ] && exit 0
          manifest=pr-assistant/.claude-plugin/plugin.json
          version() { node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s||"{}").version??""))'; }
          before=$(git show "$(git merge-base "$BASE" HEAD)":"$manifest" 2>/dev/null | version)
          after=$(version < "$manifest")
          if [ -z "$after" ] || [ "$before" = "$after" ]; then
            echo "::error file=$manifest::pr-assistant changed but its version did not (still '$after'). Bump \"version\" in $manifest."
            echo "$changed"
            exit 1
          fi
