name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, Mondays 06:00 UTC — catches newly-disclosed advisories in existing deps.
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Hard gate. Runtime dependencies are the ones an attacker can reach in a
      # deployed harness, and they are clean — so a new high-severity advisory
      # here fails the build rather than printing into a log nobody opens.
      - name: npm audit — runtime dependencies (hard gate)
        run: npm run audit

      # Advisory. The dev toolchain ships to nobody, and the remaining advisories
      # are eslint's bundled minimatch@3 -> brace-expansion, which is fixed only in
      # brace-expansion@5 — an ESM-era rewrite whose CommonJS build exports
      # `{ expand }` rather than a bare function, so an `overrides` pin to it makes
      # `npm audit` read 0 while minimatch@3 throws at require time. eslint 10 drops
      # the dependency, and eslint-plugin-react still peers on `^9.7`. Revisit when
      # it supports eslint 10, then fold this into the gate above.
      - name: npm audit — full tree (advisory)
        run: npm run audit:all
        continue-on-error: true

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    # Only runs on PRs — flags a PR that introduces a new vulnerable dependency,
    # without failing on advisories that already exist on the base branch.
    #
    # Advisory for now: the action requires the Dependency graph (and, on a private
    # repo, GitHub Advanced Security) to be enabled — until then it errors with
    # "not supported on this repository". continue-on-error keeps the PR green; once
    # the feature is enabled at Settings → Code security, drop continue-on-error to
    # make this a hard gate on new high-severity dependencies.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: Review dependency changes
        uses: actions/dependency-review-action@v4
        # Step-level (not job-level) continue-on-error, so the job's own check-run
        # still concludes success — a job-level flag would leave the check red.
        continue-on-error: true
        with:
          fail-on-severity: high
